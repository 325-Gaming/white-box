<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>正在前往 OBS水印发生器</title>
</head>
<body>
    <p>页面已迁移至首页。<a id="index_link" href="index.html">前往首页</a></p>
    <script>
        const target = new URL('index.html', location.href);
        target.search = location.search;
        target.hash = location.hash;
        document.getElementById('index_link').href = target.href;
        location.replace(target.href);
    </script>
</body>
</html>
